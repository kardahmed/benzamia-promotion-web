name: Bootstrap package lock

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Open lockfile pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c chore/bootstrap-package-lock
          git add package-lock.json
          git commit -m "chore: add reproducible package lock"
          git push --set-upstream origin chore/bootstrap-package-lock
          gh pr create --base main --head chore/bootstrap-package-lock --title "chore: add reproducible package lock" --body "Generated in GitHub Actions using Node.js 24. No local environment used."
