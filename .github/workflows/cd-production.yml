name: CD — Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag GHCR déjà validé en staging (ex. sha-123456789abc)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: vars.HOSTINGER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy approved image
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST"             "cd /opt/benzamia/production && IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.deploy.yml pull && IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.deploy.yml up -d --remove-orphans"
